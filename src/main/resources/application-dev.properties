spring.application.name=Bibliotheca58
server.port=8080

# PostgreSQL
spring.datasource.url= ${SPRING_LOCAL_DATASOURCE_URL}
spring.datasource.username=${SPRING_LOCAL_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_LOCAL_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name= org.postgresql.Driver

#JPA
spring.jpa.hibernate.ddl-auto=none

#Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

